services:
  - type: web
    name: testplatform-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: testplatform-db
          property: connectionString

databases:
  - name: testplatform-db
    plan: free
    databaseName: testplatform
    user: testplatform_user
