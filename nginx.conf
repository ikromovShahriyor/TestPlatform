# ==============================================================================
# Production Nginx Configuration for TestPlatform
# ==============================================================================

# Rate Limiting (API so'rovlariga spam va DDOS hujumlarining oldini olish)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # HTTP'dan HTTPS'ga avtomatik yo'naltirish (Certbot sozlagach yoqiladi)
    # return 301 https://$host$request_uri;

    # Gzip siqish (Statik fayllar va javoblar tezroq yuklanishi uchun)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Xavfsizlik sarlavhalari (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # API requestlarini Docker konteyneriga yo'naltirish (port 8080)
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (Uzoq davom etadigan test submitlar yoki eksportlar uchun)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
