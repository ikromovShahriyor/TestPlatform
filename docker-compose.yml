services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-TestPlatformDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      # User requested port 2011 on VPS host mapped to 5005 inside container
      - "${WEBAPI_PORT:-2011}:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5005
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-TestPlatformDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-SecretPassword123!}
      - Jwt__Key=${JWT_KEY:-SuperSecretKeyForTestPlatformAppWithAtLeast256BitsLongKeySecurity!}
      - Jwt__Issuer=${JWT_ISSUER:-TestPlatformIssuer}
      - Jwt__Audience=${JWT_AUDIENCE:-TestPlatformAudience}
      - Jwt__ExpireInMinutes=${JWT_EXPIRE_MINUTES:-1440}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: testplatform_v2_postgres_data

